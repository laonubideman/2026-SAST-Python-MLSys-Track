name: tests

on:
  push:
  pull_request:

jobs:
  numpy-and-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build C++ extension
        run: make PYTHON=python
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test showcase pipeline
        env:
          MPLBACKEND: Agg
        run: >-
          python showcase.py
          --train-samples 1000
          --test-samples 500
          --softmax-epochs 1
          --network-epochs 1
          --output /tmp/mnist-showcase
